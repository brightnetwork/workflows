name: "zizmor"

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      ZIZMOR_POLICY: |
        rules:
          unpinned-uses:
            config:
              policies:
                "brightnetwork/*": ref-pin
                "*": hash-pin
          dependabot-cooldown:
            config:
              days: 7
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Write org policy"
        run: echo "$ZIZMOR_POLICY" > "$RUNNER_TEMP/zizmor.yml"

      - name: "List Depot CI files"
        id: depot
        run: echo "files=$(find .depot -name '*.y*ml' -exec echo {} + 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: "Run zizmor"
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: . ${{ steps.depot.outputs.files }}
          config: ${{ runner.temp }}/zizmor.yml
          advanced-security: false
          annotations: true
          fail-on-no-inputs: false

      - name: "Check Dependabot covers actions"
        if: ${{ !cancelled() }}
        run: |
          workflows=$(find .github/workflows -name '*.y*ml' 2>/dev/null)
          depot=$(find .depot -name '*.y*ml' 2>/dev/null)
          dependabot=$(cat .github/dependabot.y*ml 2>/dev/null)

          if [ -n "$workflows$depot" ] && ! grep -q 'github-actions' <<< "$dependabot"; then
            echo "::error::.github/dependabot.yml needs a github-actions entry"
            exit 1
          fi

          if [ -n "$depot" ] && ! grep -q '/.depot/workflows' <<< "$dependabot"; then
            echo "::error::github-actions Dependabot entry needs /.depot/workflows"
            exit 1
          fi
